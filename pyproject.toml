[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domainscope"
version = "0.3.0.dev0"
description = "Fast CLI recon tool for domain and network diagnostics."
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
scope = "domainscope.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
